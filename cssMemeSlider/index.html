<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./fonts/Montserrat/stylesheet.css" />
        <link rel="stylesheet" href="./style.css" />
        <title>CSS Meme Slider</title>
    </head>

    <body class="page container">
        <header class="header">
            <h1 class="header__title">CSS Meme Slider</h1>
        </header>

        <main class="content">
            <div class="slider">
                <div class="slider__media">
                    <img src="./images/Winnie-the-Pooh.png" alt="Winnie the Pooh Meme" class="slider__img" />
                    <img
                        src="./images/Winnie-the-Pooh-thoughtful.png"
                        alt="Winnie the Pooh thoughtful Meme"
                        class="slider__img"
                    />
                    <img
                        src="./images/Winnie-the-Pooh-after5old.png"
                        alt="Winnie the Pooh after 5 old Meme"
                        class="slider__img"
                    />
                    <img
                        src="./images/Winnie-the-Pooh-tired.png"
                        alt="Winnie the Pooh tired Meme"
                        class="slider__img"
                    />
                    <img
                        src="./images/Winnie-the-Pooh-happy.png"
                        alt="Winnie the Pooh happy Meme"
                        class="slider__img"
                    />
                </div>


                <div class="slider__captions">
                        <span class="slider__text">"Who are you?"</span>
						<span class="slider__text">In 5 years, I should be a senor</span>
						<span class="slider__text">I am in 5 years</span>
						<span class="slider__text">It does</span>
						<span class="slider__text">I am pleased with</span>
                    </div>
                </div>
         </main>
    </body>
</html>
